# =============================================================================
# GitHub Actions 云端编译工作流 —— 精简仓库版
# 适用于：只存放配置文件的独立仓库（无需 Fork 大源码仓库）
# 运行时自动 clone 上游源码，再注入本仓库的定制配置
#
# 目标：磊科 Netcore N60 Pro (MT7986A) 高功率固件
# 闭源 mt_wifi + iPAiLNA + CUPS 2.4.12 + OpenClash + iStore
#
# 本仓库需要包含的文件（相对仓库根目录）：
#   .config                                  -> 定制编译配置
#   diy.sh                                   -> 定制脚本
#   files/etc/uci-defaults/99-n60-highpower  -> 高功率脚本
#   files/etc/cups/cupsd.conf                -> CUPS 配置
#   .github/workflows/build.yml              -> 本文件
# =============================================================================

name: Build N60 Pro High-Power Firmware

on:
  workflow_dispatch:
    inputs:
      log_level:
        description: '编译日志详细度 (首次建议 V=s)'
        required: false
        default: 'V=s'
        type: choice
        options:
          - 'V=s'
          - '普通'

jobs:
  build:
    name: Compile N60 Pro
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: 检出本仓库（配置文件）
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: builder-config

      - name: 释放磁盘空间
        run: |
          echo "清理前:" && df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/android /usr/share/swift /usr/lib/jvm || true
          sudo apt-get clean || true
          echo "清理后:" && df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
            intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev \
            libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
            libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz \
            mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 \
            python3-pip python3-ply python3-docutils python3-pyelftools qemu-utils \
            re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          sudo apt-get clean

      - name: Clone 上游源码
        run: |
          git clone -b openwrt-24.10-6.6 --single-branch --depth 1 \
            https://github.com/Yuzhii0718/immortalwrt-mt798x-6.6-padavanonly.git source
          cd source && echo "源码已就绪，HEAD: $(git rev-parse --short HEAD)"

      - name: 注入定制配置
        run: |
          SRC=$GITHUB_WORKSPACE/source
          CFG=$GITHUB_WORKSPACE/builder-config
          # 复制配置文件到源码根目录
          cp -f "$CFG/.config" "$SRC/.config"
          cp -f "$CFG/diy.sh" "$SRC/diy.sh"
          cp -r "$CFG/files" "$SRC/files"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> $GITHUB_ENV
          cd "$SRC"
          chmod +x diy.sh
          ./diy.sh

      - name: 缓存 ccache（加速重复编译）
        uses: actions/cache@v4
        with:
          path: .ccache
          key: n60pro-ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: n60pro-ccache-${{ runner.os }}-

      - name: 更新并安装软件源
        working-directory: source
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # luci 源自带同名 luci-app-openclash，会抢占软链导致 openclash 源包被忽略
          rm -f package/feeds/luci/luci-app-openclash
          ./scripts/feeds install -f -p openclash luci-app-openclash
          ./scripts/feeds install -f -p istore luci-app-store
          echo "===== 插件软链确认 ====="
          ls -d package/feeds/*/luci-app-openclash package/feeds/*/luci-app-store package/feeds/*/cups 2>/dev/null || true

      - name: 应用配置
        working-directory: source
        run: |
          make defconfig
          echo "===== 关键配置确认 ====="
          grep -E '^(CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_netcore_n60-pro|CONFIG_MTK_FIRST_IF_IPAILNA|CONFIG_MTK_MT_WIFI_MT7986_20260601|CONFIG_PACKAGE_kmod-mt_wifi|CONFIG_PACKAGE_cups|CONFIG_PACKAGE_luci-app-openclash|CONFIG_PACKAGE_luci-app-store)=' .config || true

      - name: 预下载源码与软件包
        working-directory: source
        run: |
          make download -j8 || make download -j1 V=s

      - name: 编译固件
        working-directory: source
        run: |
          if [ "${{ github.event.inputs.log_level }}" = "V=s" ] || [ -z "${{ github.event.inputs.log_level }}" ]; then
            make -j$(nproc) V=s || make -j1 V=s
          else
            make -j$(nproc) || make -j1 V=s
          fi

      - name: 整理固件产物
        run: |
          echo "===== 生成目录 ====="
          ls -lh source/bin/targets/mediatek/filogic/ || true
          mkdir -p artifacts
          find source/bin/targets/mediatek/filogic/ -maxdepth 1 -type f \
            \( -name '*netcore*n60*' -o -name '*.manifest' -o -name 'sha256sums' \) \
            -exec cp -f {} artifacts/ \;
          echo "===== 待上传文件 ====="
          ls -lh artifacts/
          if [ -z "$(ls -A artifacts/)" ]; then
            echo "错误：未找到固件镜像，编译可能失败"; exit 1
          fi

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: N60Pro-HighPower-Firmware
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
