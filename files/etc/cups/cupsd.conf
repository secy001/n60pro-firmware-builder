# =============================================================================
# CUPS 2.4.12 配置：允许局域网访问 Web 管理界面 (http://路由器IP:631)
# 默认固件管理地址为 192.168.6.1
# 注意：/admin 对局域网开放且无需口令，请仅在可信内网使用。
# =============================================================================
LogLevel warn
TempDir /tmp

Listen 0.0.0.0:631

Browsing yes
BrowseLocalProtocols all
DefaultAuthType Basic
WebInterface yes

# 允许本机与局域网访问打印服务
<Location />
    Order allow,deny
    Allow from all
</Location>

# 管理界面（添加/删除打印机）
<Location /admin>
    Order allow,deny
    Allow from all
</Location>

<Location /admin/conf>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from all
</Location>

# 打印任务限制
<Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from all
</Limit>

<Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job CUPS-Move-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order allow,deny
    Allow from all
</Limit>

<Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order allow,deny
    Allow from all
</Limit>

<Limit Cancel-Job CUPS-Authenticate-Job>
    Require user @OWNER @SYSTEM
    Order allow,deny
    Allow from all
</Limit>

<Limit All>
    Order allow,deny
    Allow from all
</Limit>
